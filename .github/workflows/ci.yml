name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/pw-browsers
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Go tests, real process signal and vet
        shell: pwsh
        run: |
          go test ./... -count=1 '-coverprofile=coverage.out' -timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath coverage.out -PathType Leaf)) { throw 'Go coverage profile was not written to coverage.out' }
          if ((Get-Content -LiteralPath coverage.out -TotalCount 1) -notmatch '^mode: (set|count|atomic)$') { throw 'Invalid Go coverage profile header' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath ./...
      - name: Race detector (Ubuntu with CGO)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./... -count=1 -timeout=180s
      - run: npm ci --ignore-scripts
      - name: Verify public file boundary
        run: node scripts/check-public-files.cjs
      - run: npm test
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Real browser end-to-end tests
        run: npm run test:e2e
      - name: Firefox end-to-end tests
        env:
          PULSE_BROWSER: firefox
        run: npx playwright test
      - name: Edge end-to-end tests
        if: runner.os == 'Windows'
        env:
          PULSE_BROWSER: edge
        run: npx playwright test
      - name: Windows soak launcher regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-soak-session.ps1
      - name: Standalone maintenance workflow
        shell: pwsh
        run: |
          $candidate = if ($IsWindows) { '.cache/pulse-e2e.exe' } else { '.cache/pulse-e2e' }
          node scripts/test-maintenance.cjs $candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows isolated acceptance script regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-page-acceptance.ps1
      - name: Windows standalone package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git status --porcelain=v1 --untracked-files=all
          git diff --name-status
          git diff --cached --name-status
          ./scripts/package-release.ps1 -Version 1.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-release.ps1 -ZipPath dist/pulse-v1.2.0-windows-amd64.zip -ExpectedCommit (git rev-parse HEAD)
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ runner.os }}
          path: |
            coverage.out
            test-results/
            playwright-report/
            dist/pulse-v1.2.0-windows-amd64.zip
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: warn
